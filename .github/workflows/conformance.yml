name: Conformance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plans:
    name: OpenID conformance suite, SSF receiver plans
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Run the four plans against the receiver
        env:
          EASYSSF_CONFORMANCE_TESTS: "true"
        run: uv run pytest conformance/tests/test_plans.py -v --timeout 3600
