[project]
name = "easyssf-test"
version = "0.6.0"
description = "A test transmitter for SSF receivers: signs SETs, serves metadata and a JWK Set, issues tokens, emulates stream management and the poll endpoint, in-process through an httpx transport"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "the easyssf authors" }]
keywords = ["ssf", "caep", "risc", "openid", "security-events", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "easyssf-core[signing]>=0.6,<0.7",
    "joserfc>=1.7,<2",
    "httpx>=0.28,<1",
]

[project.urls]
Homepage = "https://easyssf.org"
Repository = "https://github.com/easyssf/easyssf-python"
Changelog = "https://github.com/easyssf/easyssf-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easyssf"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "tests"]

[tool.uv.sources]
easyssf-core = { workspace = true }
